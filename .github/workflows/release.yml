name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Must stay in step with `SIDECAR_REPOSITORY` in `src/sidecar_image.rs` —
  # that constant is what an installed `fghjd` pulls from, and it is
  # deliberately a literal in both places rather than
  # `github.repository_owner`. A fork that templated the owner here would push
  # its sidecar to its own namespace while its `fghjd` kept pulling ours, and
  # because the version would usually match, the wrong image would arrive
  # without an error. Forking the sidecar means editing both.
  SIDECAR_IMAGE: ghcr.io/mlnja/fghj-sidecar

jobs:
  # ── fghj + fghjd: macOS only (fghjd shells out to macOS's `security` CLI
  # and writes macOS-specific paths for CA/trust-store management) ─────────
  build:
    name: Build (${{ matrix.suffix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            suffix: darwin-arm64
          - os: macos-15-intel
            suffix: darwin-amd64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # `ui/dist` is gitignored and `web::ui`'s `include_dir!` panics at
      # compile time without it, so this is a hard prerequisite of the cargo
      # build below, not an extra.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Build fghj and fghjd
        run: cargo build --release --bin fghj --bin fghjd

      - name: Strip and package
        run: |
          strip target/release/fghj target/release/fghjd
          mkdir -p dist
          cp target/release/fghj dist/fghj-${{ matrix.suffix }}
          cp target/release/fghjd dist/fghjd-${{ matrix.suffix }}
          cd dist
          tar czf fghj-${{ matrix.suffix }}.tar.gz fghj-${{ matrix.suffix }} fghjd-${{ matrix.suffix }}
          sha256sum fghj-${{ matrix.suffix }}.tar.gz > fghj-${{ matrix.suffix }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: fghj-${{ matrix.suffix }}
          path: dist/

  # ── fghj-sidecar: the in-network TLS/DNS proxy, one container per run ─────
  #
  # Without this, the first run on a freshly installed fghj compiles the whole
  # crate inside a container (`sidecar_image.rs`'s fallback path) — minutes of
  # rust:1-bookworm plus a cold cargo build, for an image the project can
  # build once. It is published under the *crate* version, which is what
  # `image_tag()` asks for; the git tag is not consulted.
  #
  # Built natively per architecture rather than with one QEMU-emulated buildx
  # run: this is a full release compile of the crate, and emulating it on
  # arm64 turns a few minutes into most of an hour.
  sidecar:
    name: Sidecar image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            slug: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only, with no tag: a tag pushed from two runners in
      # parallel would just be the loser overwriting the winner, leaving a
      # single-arch image. The `merge` job below is what names them.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sidecar/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=sidecar-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=sidecar-${{ matrix.slug }}
          outputs: type=image,name=${{ env.SIDECAR_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ steps.push.outputs.digest }}" > "digests/${{ matrix.slug }}"

      - uses: actions/upload-artifact@v4
        with:
          name: sidecar-digest-${{ matrix.slug }}
          path: digests/
          retention-days: 1

  # Turns the per-arch digests into one manifest list under the crate version,
  # so `docker pull ghcr.io/mlnja/fghj-sidecar:x.y.z` resolves to whichever
  # architecture the user's Docker is running.
  sidecar-merge:
    name: Sidecar manifest
    needs: [sidecar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: sidecar-digest-*
          merge-multiple: true
          path: digests

      # The crate version, not the git tag: `image_tag()` is built from
      # `CARGO_PKG_VERSION`, so Cargo.toml is the only source of truth that
      # can't drift away from what the shipped binary will ask for.
      - name: Read crate version
        id: version
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sidecar version: $version"

      - name: Create manifest list
        run: |
          set -euo pipefail
          refs=()
          for f in digests/*; do
            refs+=("$SIDECAR_IMAGE@$(cat "$f")")
          done
          echo "merging ${refs[*]}"
          docker buildx imagetools create \
            --tag "$SIDECAR_IMAGE:${{ steps.version.outputs.version }}" \
            "${refs[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "$SIDECAR_IMAGE:${{ steps.version.outputs.version }}"

  # ── GitHub Release ────────────────────────────────────────────────────────
  #
  # Gated on the sidecar publish as well as the binaries. A release whose
  # sidecar image is missing still *works* — `sidecar_image.rs` falls back to
  # compiling it locally — but it silently hands every new user the slow first
  # run this job exists to remove, which is worse than not cutting the
  # release. Re-run the workflow once the push succeeds.
  create-release:
    name: Create Release
    needs: [build, sidecar-merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Only the two macOS binary artifacts. Without a pattern this
      # downloads everything the run produced, which also means the
      # `.dockerbuild` build records `docker/build-push-action` uploads and
      # the `sidecar-digest-*` scratch files — none of which this job reads,
      # and any one of which can fail the whole release on a flaky blob
      # fetch. That is exactly how v0.1.1 failed.
      - uses: actions/download-artifact@v4
        with:
          pattern: fghj-darwin-*
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) \
            -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Homebrew tap ──────────────────────────────────────────────────────────
  #
  # Rewrites Formula/fghj.rb in mlnja/homebrew-tap with this release's version
  # and checksums, so `brew install mlnja/tap/fghj` serves the new build
  # without a manual step. The `just update-tap` recipe does the same thing by
  # hand and stays as the escape hatch for fixing a formula without cutting a
  # release; both drive the same `# darwin-<arch>` marker comments in the
  # formula, so they can't disagree about where a checksum goes.
  #
  # Needs HOMEBREW_TAP_TOKEN: a fine-grained PAT with Contents:write on
  # mlnja/homebrew-tap. The default GITHUB_TOKEN is scoped to this repo only
  # and cannot push to the tap.
  #
  # Gated on create-release so the formula never points at URLs that 404:
  # the release assets must exist before anything tells Homebrew to fetch
  # them.
  tap:
    name: Update Homebrew tap
    needs: [create-release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read crate version
        id: version
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: mlnja/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Rewrite the formula
        run: |
          set -euo pipefail
          formula=tap/Formula/fghj.rb
          version="${{ steps.version.outputs.version }}"

          sed -i "s/^  version \"[^\"]*\"/  version \"$version\"/" "$formula"

          for platform in darwin-arm64 darwin-amd64; do
            sha=$(cut -d' ' -f1 < "$(find artifacts -name "fghj-$platform.tar.gz.sha256" | head -1)")
            echo "  $platform  $sha"
            awk -v sha="$sha" -v marker="# $platform" \
              '$0 ~ marker { sub(/"[0-9a-f]+"/, "\"" sha "\"") } { print }' \
              "$formula" > "$formula.tmp" && mv "$formula.tmp" "$formula"
          done

          # A formula still holding placeholder zeros would install nothing
          # and fail only at `brew install` time, on a user's machine.
          if grep -q '"0\{64\}"' "$formula"; then
            echo "::error::formula still contains placeholder checksums"
            exit 1
          fi
          git -C tap diff -- Formula/fghj.rb

      - name: Commit and push
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/fghj.rb; then
            echo "formula already up to date, nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/fghj.rb
          git commit -m "fghj ${{ steps.version.outputs.version }}"
          git push
