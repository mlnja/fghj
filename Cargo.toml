[package]
name = "fghj"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bollard = { version = "0.21.1", features = ["buildkit", "time"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
include_dir = "0.7.4"
libc = "0.2"
rcgen = { version = "0.14.9", features = ["x509-parser"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "fs", "io-util", "io-std", "signal"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-tungstenite = "0.29.0"
rustls-native-certs = "0.8.4"
pem = "3"
bytes = "1.12.1"

[dev-dependencies]
x509-parser = { version = "0.18.1", features = ["verify"] }

# Tuned for speed, not size: fghjd is a long-lived daemon whose binary is
# downloaded once and then runs for weeks, so size is the cheap axis.
# opt-level = "z" would take it from 12.4 MB to 6.8 MB, and is deliberately
# not used — it shrinks LLVM's inlining threshold and disables loop
# vectorisation across rustls' record layer and tokio/hyper's buffer
# handling. Fat LTO over all 254 crates plus a single codegen unit is the
# opposite trade: a bigger compile (~2 min, release only) in exchange for
# cross-crate inlining.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false

# Debug info is dead weight in a shipped artifact — it costs size and does
# nothing for speed. CI strips as well; this makes a local `cargo build
# --release` produce the same bytes.
debug = false
strip = "symbols"

# NOT panic = "abort", even though it would save ~2.3 MB and elide the
# landing pads. fghjd is one process supervising every workspace at once,
# and unwinding is what keeps one workspace's panic from taking down DNS,
# 80/443 and every other workspace with it. `supervisor::supervise` needs
# per-task panic reporting to work at all; see src/supervisor.rs.
panic = "unwind"

# target/debug reached 36 GB: 200k stale .o files, because macOS defaults
# to split-debuginfo = "unpacked" and Cargo never garbage-collects old
# artifacts. Dependencies are ~253 of the 254 crates and are not where
# anyone sets a breakpoint, so they emit no debuginfo; this crate keeps
# full debuginfo. "packed" folds what remains into .dSYM bundles instead
# of a sea of loose object files.
[profile.dev]
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false
