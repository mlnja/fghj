[package]
name = "fghj"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bollard = "0.21.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
include_dir = "0.7.4"
libc = "0.2"
rcgen = { version = "0.14.9", features = ["x509-parser"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "fs", "io-util"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }

[dev-dependencies]
x509-parser = { version = "0.18.1", features = ["verify"] }
