[package]
name = "fghj"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
bollard = "0.21.1"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
include_dir = "0.7.4"
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "fs", "io-util"] }
