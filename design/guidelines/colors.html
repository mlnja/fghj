<!-- @dsCard group="Colors" viewport="700x170" subtitle="Industrial dark canvas, safety-orange accent" name="Core Palette" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:6px;padding:16px;font-family:var(--font-mono);background:var(--bg)">
  <div style="width:64px"><div style="height:56px;background:var(--bg);border:1px solid var(--line);border-radius:4px"></div><div style="font-size:10px;margin-top:4px;color:var(--ink-faint)">bg</div></div>
  <div style="width:64px"><div style="height:56px;background:var(--panel);border-radius:4px"></div><div style="font-size:10px;margin-top:4px;color:var(--ink-faint)">panel</div></div>
  <div style="width:64px"><div style="height:56px;background:var(--panel-2);border-radius:4px"></div><div style="font-size:10px;margin-top:4px;color:var(--ink-faint)">panel-2</div></div>
  <div style="width:64px"><div style="height:56px;background:var(--line-strong);border-radius:4px"></div><div style="font-size:10px;margin-top:4px;color:var(--ink-faint)">line</div></div>
  <div style="width:64px"><div style="height:56px;background:var(--accent-dim);border-radius:4px"></div><div style="font-size:10px;margin-top:4px;color:var(--ink-faint)">accent-dim</div></div>
  <div style="width:64px"><div style="height:56px;background:var(--accent);border-radius:4px"></div><div style="font-size:10px;margin-top:4px;color:var(--ink-faint)">accent</div></div>
  <div style="width:64px"><div style="height:56px;background:var(--success);border-radius:4px"></div><div style="font-size:10px;margin-top:4px;color:var(--ink-faint)">success</div></div>
  <div style="width:64px"><div style="height:56px;background:var(--warning);border-radius:4px"></div><div style="font-size:10px;margin-top:4px;color:var(--ink-faint)">warning</div></div>
  <div style="width:64px"><div style="height:56px;background:var(--danger);border-radius:4px"></div><div style="font-size:10px;margin-top:4px;color:var(--ink-faint)">danger</div></div>
</div>
