<!-- @dsCard group="Colors" viewport="700x110" subtitle="Success / warning / danger" name="Status Colors" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:10px;padding:16px;font-family:var(--font-mono);font-size:11px">
  <div style="padding:6px 12px;border-radius:999px;background:var(--success-bg);color:var(--success)">RUNNING</div>
  <div style="padding:6px 12px;border-radius:999px;background:var(--warning-bg);color:var(--warning)">DIRTY</div>
  <div style="padding:6px 12px;border-radius:999px;background:var(--danger-bg);color:var(--danger)">ERROR</div>
</div>
